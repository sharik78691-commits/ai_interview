<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page not found — OyeInterview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Served by Vercel with HTTP 404 for any URL that is not a real page, so
       search engines drop dead links instead of indexing copies of the home page. -->
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#137547">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <style>
    :root { --bg: #fffbea; --card: #ffffff; --border: #f0e2a8; --text: #1a1a1a; --muted: #5c5640; --accent: #ffc61a; --ink: #854d0e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14120a; --card: #211e11; --border: #35301a; --text: #fbf6e4; --muted: #c2b98f; --ink: #ffd75e; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
           background: var(--bg); color: var(--text);
           font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
    main { width: 100%; max-width: 520px; text-align: center; background: var(--card);
           border: 1px solid var(--border); border-radius: 20px; padding: 40px 28px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .06em;
             color: var(--text); text-decoration: none; }
    .brand img { width: 36px; height: 36px; }
    .code { font-size: 64px; font-weight: 800; margin: 24px 0 4px; color: var(--ink); }
    h1 { font-size: 24px; margin: 0 0 10px; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
    .cta { display: inline-block; background: var(--accent); color: #1a1200; font-weight: 700;
           padding: 12px 22px; border-radius: 999px; text-decoration: none; }
    nav { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; }
    nav a { color: var(--ink); text-decoration: none; font-weight: 600; }
    nav a:hover, .cta:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/"><img src="/logo.svg" alt="">OYE INTERVIEW</a>
    <div class="code">404</div>
    <h1>We couldn't find that page</h1>
    <p>The link may be old or mistyped. Everything else is still here.</p>
    <a class="cta" href="/">Go to the home page</a>
    <nav aria-label="Popular pages">
      <a href="/features">Features</a>
      <a href="/how-it-works">How it works</a>
      <a href="/pricing">Pricing</a>
      <a href="/contact">Contact</a>
      <a href="/login">Sign in</a>
    </nav>
  </main>
</body>
</html>
