        "@type": "Question",
        "name": "Do I need a microphone to use OyeInterview?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. You can type questions manually or run the one-click demo simulation. A microphone enables live transcription of the interviewer."
        }
      },
      {
        "@type": "Question",
        "name": "Which browsers work best with OyeInterview?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Chrome or Edge work best because they support the Web Speech recognition API. Other browsers fall back to typing questions manually."
        }
      },
      {
        "@type": "Question",
        "name": "Where does my interview data go?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Resume text and job description are stored in your browser's localStorage. Only the text of detected questions is sent to the backend to generate guidance."
        }
      },
      {
        "@type": "Question",
        "name": "Can OyeInterview write code for me?",
        "acceptedAnswer": {
          "@type": "Answer",
