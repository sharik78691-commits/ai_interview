  <!-- ======================= STRUCTURED DATA (JSON-LD) =================== -->
  <!-- SoftwareApplication: helps Google show a rich app result. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "OyeInterview",
    "alternateName": "AI Interview Assistant",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "url": "https://www.oyeinterview.com/",
    "description": "AI interview practice and preparation assistant that provides resume-aware answers, STAR stories and code hints for technical, behavioral and coding interviews.",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>

  <!-- FAQPage: enables FAQ rich snippets in Google search results. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "How does the OyeInterview mock interview work?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Choose a role, interview type and difficulty. OyeInterview asks practice questions, you answer in your own words (typed or spoken), and you get a score out of 10 with what worked, what to improve and what a strong answer covers."
        }
      },
      {
        "@type": "Question",
        "name": "Do I need a microphone to use OyeInterview?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. You can type questions manually or run the one-click demo simulation. A microphone enables automatic transcription of practice questions."
        }
      },
      {
        "@type": "Question",
        "name": "Which browsers work best with OyeInterview?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Chrome or Edge work best because they support the Web Speech recognition API. Other browsers fall back to typing questions manually."
        }
      },
      {
        "@type": "Question",
        "name": "Where does my interview data go?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Your saved resumes and target roles are stored in your OyeInterview account. During a session, question text plus your resume and job description are sent to the selected AI provider to generate answers; interviewer (meeting or tab) audio clips are sent to a speech-to-text provider. Transcripts are not stored in your account. See the Privacy Policy for details."
        }
      },
      {
        "@type": "Question",
        "name": "Can OyeInterview write code for me?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "It gives hints, complexity notes and code skeletons, but you still own the final answer."
        }
      }
    ]
  }
  </script>
