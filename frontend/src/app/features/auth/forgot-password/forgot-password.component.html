<section class="auth-wrap">
  <div class="auth-card card">
    <div class="auth-head">
      <span class="logo">◈</span>
      <h1>Forgot password?</h1>
      <p class="muted">Enter your email and we'll send a reset link.</p>
    </div>

    @if (message) { <div class="banner info">{{ message }}</div> }
    @if (error) { <div class="banner error">{{ error }}</div> }

    <form (ngSubmit)="submit()" #f="ngForm">
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" [(ngModel)]="email" autocomplete="email" placeholder="you@example.com" required />
      </label>
      <button type="submit" class="btn-primary full" [disabled]="loading">
        {{ loading ? 'Sending…' : 'Send reset link' }}
      </button>
    </form>

    <p class="auth-foot muted"><a routerLink="/login">Back to sign in</a></p>
  </div>
</section>
