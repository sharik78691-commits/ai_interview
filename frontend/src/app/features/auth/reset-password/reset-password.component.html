<section class="auth-wrap">
  <div class="auth-card card">
    <div class="auth-head">
      <span class="logo">◈</span>
      <h1>Reset password</h1>
      <p class="muted">Choose a new password for your account.</p>
    </div>

    @if (message) { <div class="banner info">{{ message }}</div> }
    @if (error) { <div class="banner error">{{ error }}</div> }

    <form (ngSubmit)="submit()" #f="ngForm">
      <label class="field">
        <span>New Password</span>
        <input type="password" name="password" [(ngModel)]="password" autocomplete="new-password" placeholder="At least 8 characters" required />
      </label>
      <label class="field">
        <span>Confirm Password</span>
        <input type="password" name="confirm" [(ngModel)]="confirm" autocomplete="new-password" placeholder="Repeat password" required />
      </label>
      <button type="submit" class="btn-primary full" [disabled]="loading">
        {{ loading ? 'Resetting…' : 'Reset password' }}
      </button>
    </form>

    <p class="auth-foot muted"><a routerLink="/login">Back to sign in</a></p>
  </div>
</section>
