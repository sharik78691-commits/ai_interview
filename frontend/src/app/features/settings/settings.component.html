<div class="container page">
  <h1>Settings</h1>
  <p class="muted">Tune the assistant. Preferences persist in your browser.</p>
  <app-error-banner [message]="error" (dismiss)="error=''"></app-error-banner>
  <div class="card form">
    <label class="lbl" for="model">AI model</label>
    <select id="model" [(ngModel)]="aiModel">
      <option value="auto">Auto (backend default)</option>
      <option value="llama">Llama / local</option>
      <option value="openai">OpenAI-compatible</option>
    </select>
    <label class="lbl" for="stt">Speech-to-text provider</label>
    <select id="stt" [(ngModel)]="sttProvider">
      <option value="browser">Browser (Web Speech API)</option>
      <option value="manual">Manual typing only</option>
    </select>
    <label class="lbl" for="len">Response length</label>
    <select id="len" [(ngModel)]="responseLength">
      <option value="short">Short — quick bullets (3–4)</option>
      <option value="medium">Medium — structured answer (5–7)</option>
      <option value="long">Long — detailed with examples (8–12)</option>
    </select>
    <p class="muted small" style="margin-top:-4px">
      Controls how much the AI writes. "Long" answers like a senior engineer: definition,
      mechanism, trade-offs, comparisons, real production example.
    </p>
    <label class="lbl" for="theme">Theme</label>
    <select id="theme" [(ngModel)]="theme">
      <option value="dark">Dark</option>
      <option value="light">Light</option>
    </select>
    <label class="lbl" for="mic">Microphone</label>
    <select id="mic" [(ngModel)]="micId">
      <option value="">Default microphone</option>
      @for (m of mics; track m.deviceId) { <option [value]="m.deviceId">{{ m.label || 'Microphone' }}</option> }
    </select>
    <div class="row">
      <button class="btn-primary" (click)="save()">Save</button>
      <button class="btn-ghost" (click)="reset()">Reset defaults</button>
      @if (saved) { <span class="ok">✓ Saved</span> }
    </div>
    <p class="muted small" style="margin-top:14px">Backend status: <strong>{{ health }}</strong></p>
  </div>
</div>
