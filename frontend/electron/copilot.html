<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OyeInterview Copilot</title>
    <style>
      :root {
        --bg: #0b1020;
        --card: #141b31;
        --border: rgba(140, 150, 180, 0.18);
        --text: #e6ecff;
        --muted: #8b96b3;
        --accent: #6e8bff;
        --green: #34d399;
        --purple: #a06eff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        line-height: 1.55;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 12px;
        background: linear-gradient(90deg, rgba(110, 139, 255, 0.16), rgba(160, 110, 255, 0.10)), var(--card);
        border-bottom: 1px solid var(--border);
        -webkit-app-region: drag;
        user-select: none;
      }
      .bar .title {
        font-weight: 700;
        font-size: 13px;
        letter-spacing: -0.01em;
      }
      .bar .badge {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--green);
        border: 1px solid rgba(52, 211, 153, 0.4);
        border-radius: 999px;
        padding: 1px 8px;
      }
      .close {
        -webkit-app-region: no-drag;
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 16px;
        line-height: 1;
        width: 26px;
        height: 26px;
        border-radius: 6px;
        cursor: pointer;
      }
      .close:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
      }
      .card h2 {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .transcript-text {
        margin: 0;
        color: var(--green);
        font-size: 15px;
      }
      .transcript-text.empty { color: var(--muted); font-style: italic; }
      .guidance h3 {
        margin: 14px 0 6px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #b9c6ff;
        border-left: 3px solid var(--accent);
        padding-left: 8px;
      }
      .q {
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .tag {
        display: inline-block;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        background: linear-gradient(90deg, var(--accent), var(--purple));
        color: #fff;
        border-radius: 999px;
        padding: 2px 10px;
      }
      .qtext { margin: 8px 0 0; font-weight: 700; }
      ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
      li::marker { color: var(--accent); font-weight: 700; }
      ul.take li { color: #cfe0d8; border-left: 2px solid rgba(52, 211, 153, 0.5); padding-left: 8px; }
      .example {
        margin: 0;
        background: rgba(110, 139, 255, 0.08);
        border: 1px solid rgba(110, 139, 255, 0.3);
        border-left: 3px solid var(--accent);
        border-radius: 8px;
        padding: 8px 12px;
      }
      pre {
        margin: 0;
        background: #0a0e18;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        overflow-x: auto;
        white-space: pre-wrap;
        font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
        font-size: 12px;
        color: #d6e2ff;
      }
      .empty { margin: 0; color: var(--muted); font-style: italic; }
    </style>
  </head>
  <body>
    <header class="bar">
      <span class="title">✨ OyeInterview Copilot <span class="badge">invisible</span></span>
      <button class="close" id="close" title="Close">✕</button>
    </header>

    <main>
      <section class="card transcript">
        <h2>🎧 Interviewer (meeting audio)</h2>
        <p id="transcript" class="transcript-text empty">Listening for the interviewer's question…</p>
      </section>

      <section class="card guidance">
        <h2>✨ AI Guidance</h2>
        <div id="guidance"><p class="empty">Waiting for a question…</p></div>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const transcriptEl = $('transcript');
      const guidanceEl = $('guidance');

      $('close').addEventListener('click', () => window.copilotAPI.close());
      window.copilotAPI.onUpdate(render);
      // Pull the latest state on load so a (re)opened window is never blank.
      window.copilotAPI.getState().then((payload) => {
        if (payload) render(payload);
      });

      function render(payload) {
        const t = (payload.transcript || '').trim();
        transcriptEl.textContent = t || "Listening for the interviewer's question…";
        transcriptEl.classList.toggle('empty', !t);
        payload.guidance ? renderGuidance(payload.guidance) : showEmpty();
      }

      function showEmpty() {
        guidanceEl.innerHTML = '<p class="empty">Waiting for a question…</p>';
      }

      function renderGuidance(g) {
        const html = [];
        html.push(
          `<div class="q"><span class="tag">${esc(g.questionType)}</span>` +
            `<p class="qtext">${esc(g.question)}</p></div>`,
        );
        if (g.answerPoints && g.answerPoints.length) {
          html.push('<h3>Answer points</h3><ul>' + g.answerPoints.map((p) => `<li>${esc(p)}</li>`).join('') + '</ul>');
        }
        if (g.keyTakeaways && g.keyTakeaways.length) {
          html.push('<h3>Impress the interviewer</h3><ul class="take">' + g.keyTakeaways.map((p) => `<li>${esc(p)}</li>`).join('') + '</ul>');
        }
        if (g.example) html.push(`<h3>Example</h3><p class="example">${esc(g.example)}</p>`);
        if (g.star) {
          html.push('<h3>STAR</h3>');
          if (typeof g.star === 'object') {
            html.push('<ul>' + Object.entries(g.star).map(([k, v]) => `<li><b>${esc(k)}:</b> ${esc(String(v))}</li>`).join('') + '</ul>');
          } else {
            html.push(`<p class="example">${esc(String(g.star))}</p>`);
          }
        }
        if (g.codeHint) html.push(`<h3>Code hint</h3><pre>${esc(g.codeHint)}</pre>`);
        if (g.followUpQuestions && g.followUpQuestions.length) {
          html.push('<h3>Follow-ups</h3><ul>' + g.followUpQuestions.map((p) => `<li>${esc(p)}</li>`).join('') + '</ul>');
        }
        guidanceEl.innerHTML = html.join('');
      }

      function esc(s) {
        return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }
    </script>
  </body>
</html>
